<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse Inventory System (Cloud Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Library ของ Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --font-sans: 'Inter', 'Prompt', sans-serif; }
        body { 
            font-family: var(--font-sans); 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f1f5f9;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-transition { 
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); 
            will-change: transform;
        }
        .backdrop { transition: opacity 0.3s ease; }
        
        @media (max-width: 768px) {
            .touch-active:active {
                transform: scale(0.97);
                transition: transform 0.1s;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-x-hidden">

    <div class="max-w-7xl mx-auto min-h-screen flex flex-col relative">

        <!-- Header -->
        <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 pt-safe-top md:px-4">
            <div class="px-5 pt-6 pb-4 md:flex md:items-center md:justify-between md:gap-8">
                <div class="flex justify-between items-center mb-4 md:mb-0 shrink-0">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">คลังอุปกรณ์</h1>
                        <p class="text-sm text-slate-500 font-medium mt-0.5">ระบบซิงค์ข้อมูลผ่านคลาวด์ (Live)</p>
                    </div>
                    <button class="md:hidden w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition touch-active">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                    </button>
                </div>
                
                <div class="relative group flex-1 max-w-2xl w-full">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400 group-focus-within:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" placeholder="ค้นหาด้วยชื่อ, SKU, หรือตำแหน่ง..." class="w-full bg-slate-100/80 border border-transparent focus:bg-white focus:border-blue-500/30 focus:ring-4 focus:ring-blue-500/10 pl-11 pr-12 py-3 md:py-3.5 rounded-2xl text-sm transition-all outline-none placeholder:text-slate-400">
                    <button class="absolute inset-y-0 right-0 pr-3 flex items-center" onclick="fetchEquipments()">
                        <div class="hidden md:flex p-1.5 px-3 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-colors cursor-pointer items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> รีเฟรช
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area (สร้างการ์ดอัตโนมัติจาก Supabase) -->
        <main id="equipment-grid" class="flex-1 px-4 md:px-8 py-5 md:py-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 auto-rows-max pb-24 md:pb-8">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-blue-600 mb-4"></div>
                <p class="text-slate-500 font-medium">กำลังโหลดข้อมูลจากฐานข้อมูล...</p>
            </div>
        </main>

        <!-- ==================== Item Detail Modal / Drawer ==================== -->
        <div id="modalBackdrop" class="backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden opacity-0" onclick="closeModal()"></div>

        <div id="bottomSheet" class="modal-transition fixed z-50 bg-white shadow-2xl flex flex-col 
             inset-x-0 bottom-0 rounded-t-[32px] max-h-[92vh] translate-y-full 
             md:inset-y-0 md:right-0 md:left-auto md:w-[480px] md:max-h-screen md:rounded-none md:translate-y-0 md:translate-x-full">
            
            <div class="sticky top-0 z-10 bg-white/95 backdrop-blur rounded-t-[32px] md:rounded-none pb-2 pt-3 md:pt-6 px-6 flex flex-col md:flex-row md:justify-between items-center border-b border-slate-100">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mb-4 md:hidden"></div>
                
                <div class="w-full flex justify-between items-center pb-2 md:pb-4">
                    <span class="text-xs md:text-sm font-bold text-slate-400 tracking-widest uppercase flex items-center gap-2">
                        <svg class="w-4 h-4 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                        <span id="detailSku">SKU</span>
                    </span>
                    <button onclick="closeModal()" class="w-8 h-8 md:w-10 md:h-10 bg-slate-100 md:bg-white md:border border-slate-200 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 md:hover:bg-slate-50 transition-colors">
                        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="overflow-y-auto hide-scrollbar px-6 pb-32 md:pb-40 flex-1">
                <div class="flex gap-4 mb-6 mt-4 md:mt-2 md:flex-col lg:flex-row">
                    <div class="w-24 h-24 md:w-full md:h-48 lg:w-32 lg:h-32 rounded-2xl bg-slate-100 overflow-hidden shrink-0 border border-slate-200">
                        <img id="detailImg" src="" class="w-full h-full object-cover">
                    </div>
                    <div class="flex flex-col justify-center">
                        <h2 id="detailTitle" class="text-xl md:text-2xl font-bold text-slate-900 leading-tight mb-2 md:mb-3"></h2>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-600 text-[11px] md:text-xs font-bold px-2.5 py-1 md:px-3 md:py-1.5 rounded-md">
                                <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                <span id="detailLocation"></span>
                            </span>
                            <span id="detailStatusTag" class="text-[11px] md:text-xs font-bold px-2.5 py-1 md:px-3 md:py-1.5 rounded-md"></span>
                        </div>
                    </div>
                </div>

                <div class="h-px w-full bg-slate-100 mb-6"></div>

                <div class="flex justify-between items-end mb-4">
                    <h3 class="text-sm md:text-base font-bold text-slate-900">รายการของในเซ็ต</h3>
                    <span class="text-[11px] md:text-xs font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded">เช็คแล้ว <span id="checkedCount" class="text-slate-900 font-bold">0</span>/<span id="totalCount">0</span></span>
                </div>
                
                <div id="detailChecklist" class="space-y-2.5 md:space-y-3">
                    <!-- HTML Checklist จะถูกสร้างด้วย JS -->
                </div>
                
                <div class="mt-8">
                    <label class="text-sm md:text-base font-bold text-slate-900 mb-2 block">บันทึกเพิ่มเติม (ถ้ามี)</label>
                    <textarea id="noteInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 md:p-4 text-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all placeholder:text-slate-400" rows="3" placeholder="เช่น รอยขีดข่วน, อุปกรณ์ชำรุด..."></textarea>
                </div>
            </div>

            <div class="absolute bottom-0 inset-x-0 p-5 md:p-6 bg-white/95 backdrop-blur-md border-t border-slate-100 pb-safe-bottom">
                <button id="saveBtn" onclick="saveInspection()" class="w-full py-3.5 md:py-4 rounded-xl text-white font-bold text-sm md:text-base text-center shadow-lg transition-all touch-active bg-slate-900 hover:bg-slate-800 shadow-slate-900/20 flex items-center justify-center gap-2">
                    บันทึกการตรวจสอบ
                </button>
            </div>
        </div>

    </div>

    <!-- ==================== JAVASCRIPT & SUPABASE LOGIC ==================== -->
    <script>
        // ------------------------------------------------------------------
        // 🚨 นำ URL และ ANON KEY จาก Supabase (ตั้งค่า > API) มาวางที่นี่ครับ 🚨
        // ------------------------------------------------------------------
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE'; 
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        
        // สร้างการเชื่อมต่อ
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ตัวแปรเก็บสถานะการเปิด Modal
        let totalItems = 0;
        let currentItemId = null;
        
        // ฟังก์ชันดึงข้อมูลจาก Database
        async function fetchEquipments() {
            const grid = document.getElementById('equipment-grid');
            
            // ดึงข้อมูลจากตาราง equipments
            const { data, error } = await supabase
                .from('equipments')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", error);
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500 font-bold">ไม่สามารถเชื่อมต่อฐานข้อมูลได้<br><span class="text-sm font-normal">กรุณาตรวจสอบ URL และ API KEY ในโค้ดอีกครั้ง</span></div>`;
                return;
            }

            renderCards(data);
        }

        // ฟังก์ชันวาดการ์ดอุปกรณ์ลงหน้าเว็บ
        function renderCards(equipments) {
            const container = document.getElementById('equipment-grid');
            container.innerHTML = ''; // ล้าง Loading ออก

            if (!equipments || equipments.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500">ยังไม่มีข้อมูลในระบบ กรุณาเพิ่มข้อมูลใน Supabase SQL</div>`;
                return;
            }

            equipments.forEach(item => {
                const statusColor = item.is_ready ? 'emerald' : 'amber';
                const statusText = item.is_ready ? 'พร้อมใช้' : 'เช็คด่วน';
                const statusIndicator = item.is_ready ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]' : 'bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.8)] animate-pulse';
                const ringStyle = item.is_ready ? 'border-slate-200' : 'border-amber-200 ring-1 ring-amber-100';
                
                // แปลงข้อมูล Array เป็น String เพื่อส่งเข้าฟังก์ชัน
                const itemsArray = Array.isArray(item.items) ? item.items : [];
                const encodedItems = encodeURIComponent(JSON.stringify(itemsArray));

                const cardHtml = `
                    <div onclick="openItemDetail('${item.id}', '${item.name}', '${item.sku}', '${item.location}', '${item.image_url}', '${encodedItems}', ${item.is_ready})" 
                         class="bg-white p-3.5 md:p-5 rounded-2xl shadow-sm border ${ringStyle} flex flex-row md:flex-col gap-4 md:gap-5 touch-active cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group">
                        
                        <div class="relative w-24 h-24 md:w-full md:h-48 shrink-0 rounded-xl overflow-hidden bg-slate-100">
                            <img src="${item.image_url}" class="w-full h-full object-cover ${!item.is_ready ? 'saturate-50' : ''} group-hover:scale-105 transition-transform duration-500" alt="${item.name}">
                            <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/60 to-transparent p-2 md:p-3 pt-6 md:pt-10">
                                <p class="text-[10px] md:text-xs text-white font-medium flex items-center gap-1.5">
                                    <span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${statusIndicator}"></span> ${item.is_ready ? 'ปกติ' : 'ไม่ครบเซ็ต'}
                                </p>
                            </div>
                        </div>
                        
                        <div class="flex flex-col justify-between flex-1 py-0.5 min-w-0">
                            <div>
                                <div class="flex justify-between items-start mb-1 md:mb-2">
                                    <span class="text-[10px] md:text-xs font-semibold text-slate-400 tracking-wider">${item.sku}</span>
                                    <span class="bg-${statusColor}-50 text-${statusColor}-600 text-[10px] md:text-xs font-bold px-2 py-0.5 rounded-md">${statusText}</span>
                                </div>
                                <h3 class="font-semibold md:font-bold text-slate-900 leading-tight truncate md:text-lg">${item.name}</h3>
                            </div>
                            <div class="flex items-center justify-between mt-2 md:mt-4 pt-2 md:border-t border-slate-100">
                                <div class="flex items-center gap-1.5 text-xs md:text-sm text-slate-500 font-medium">
                                    <svg class="w-3.5 h-3.5 md:w-4 md:h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                    ${item.location}
                                </div>
                                <div class="text-xs font-semibold text-${item.is_ready ? 'slate-700 bg-slate-100' : 'amber-700 bg-amber-100'} px-2 py-1 md:px-2.5 md:py-1.5 rounded-lg">เซ็ต ${itemsArray.length} ชิ้น</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // การเปิด Modal รายละเอียดอุปกรณ์
        function openItemDetail(id, title, sku, location, img, encodedItems, statusOk) {
            currentItemId = id; // บันทึก ID ของตัวที่กำลังแก้ไข
            
            document.getElementById('detailTitle').textContent = title;
            document.getElementById('detailSku').textContent = sku;
            document.getElementById('detailLocation').textContent = location;
            document.getElementById('detailImg').src = img;
            document.getElementById('noteInput').value = ""; // รีเซ็ตโน้ต
            
            const statusTag = document.getElementById('detailStatusTag');
            if(statusOk) {
                statusTag.className = 'bg-emerald-50 text-emerald-600 text-[11px] md:text-xs font-bold px-2.5 py-1 md:px-3 md:py-1.5 rounded-md';
                statusTag.textContent = 'สภาพปกติ';
            } else {
                statusTag.className = 'bg-amber-50 text-amber-600 border border-amber-100 text-[11px] md:text-xs font-bold px-2.5 py-1 md:px-3 md:py-1.5 rounded-md';
                statusTag.textContent = 'ของไม่ครบ';
            }

            // ถอดรหัสข้อมูล JSON ของอุปกรณ์
            const items = JSON.parse(decodeURIComponent(encodedItems));
            totalItems = items.length;
            document.getElementById('totalCount').textContent = totalItems;
            
            const checklistHtml = items.map((item) => `
                <label class="flex items-center p-3.5 md:p-4 rounded-xl bg-white border border-slate-200 hover:border-slate-300 active:bg-slate-50 transition-colors cursor-pointer group has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50/30 md:has-[:checked]:bg-blue-50/10">
                    <div class="relative flex items-center justify-center w-5 h-5 md:w-6 md:h-6 mr-3 md:mr-4 shrink-0">
                        <input type="checkbox" onchange="updateCounter()" class="item-checkbox peer appearance-none w-5 h-5 md:w-6 md:h-6 border-2 border-slate-300 rounded-md checked:bg-blue-600 checked:border-blue-600 hover:border-blue-400 transition-all outline-none cursor-pointer">
                        <svg class="absolute w-3 h-3 md:w-4 md:h-4 text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <span class="text-sm md:text-base font-medium text-slate-700 select-none group-has-[:checked]:text-slate-900">${item}</span>
                </label>
            `).join('');
            
            document.getElementById('detailChecklist').innerHTML = checklistHtml;
            updateCounter(); // อัปเดตปุ่ม

            // แอนิเมชันเปิด Modal
            const backdrop = document.getElementById('modalBackdrop');
            const sheet = document.getElementById('bottomSheet');
            backdrop.classList.remove('hidden');
            void backdrop.offsetWidth;
            backdrop.classList.remove('opacity-0');
            sheet.classList.remove('translate-y-full', 'md:translate-x-full');
            document.body.style.overflow = 'hidden'; 
        }

        // นับจำนวนที่ติ๊กและเปลี่ยนสีปุ่ม
        function updateCounter() {
            const checked = document.querySelectorAll('.item-checkbox:checked').length;
            document.getElementById('checkedCount').textContent = checked;
            
            const btn = document.getElementById('saveBtn');
            if (checked === totalItems) {
                btn.className = "w-full py-3.5 md:py-4 rounded-xl text-white font-bold text-sm md:text-base text-center shadow-lg transition-all touch-active bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20 flex items-center justify-center gap-2";
                btn.innerHTML = `ยืนยันของครบถ้วน <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else {
                btn.className = "w-full py-3.5 md:py-4 rounded-xl text-white font-bold text-sm md:text-base text-center shadow-lg transition-all touch-active bg-slate-900 hover:bg-slate-800 shadow-slate-900/20 flex items-center justify-center gap-2";
                btn.textContent = "บันทึกข้อมูล (ของไม่ครบ)";
            }
        }

        // บันทึกข้อมูลกลับไปที่ Supabase
        async function saveInspection() {
            if(!currentItemId) return;
            
            const btn = document.getElementById('saveBtn');
            btn.textContent = 'กำลังบันทึก...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            const checkedCount = document.querySelectorAll('.item-checkbox:checked').length;
            const isComplete = (checkedCount === totalItems); // สถานะว่าของครบไหม

            // ยิงข้อมูลอัปเดตไปที่ Supabase
            const { error } = await supabase
                .from('equipments')
                .update({ is_ready: isComplete })
                .eq('id', currentItemId);

            if (error) {
                console.error("อัปเดตล้มเหลว:", error);
                alert("เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่");
                updateCounter(); // คืนสภาพปุ่มกลับมา
                return;
            }

            // สำเร็จแล้ว ทำการปิด Modal และรีเฟรชข้อมูลหน้าจอ
            closeModal();
            fetchEquipments(); 
        }

        function closeModal() {
            const backdrop = document.getElementById('modalBackdrop');
            const sheet = document.getElementById('bottomSheet');
            backdrop.classList.add('opacity-0');
            sheet.classList.add('translate-y-full', 'md:translate-x-full');
            
            setTimeout(() => {
                backdrop.classList.add('hidden');
                document.body.style.overflow = ''; 
                currentItemId = null;
            }, 300);
        }

        // เริ่มดึงข้อมูลเมื่อโหลดหน้าเว็บเสร็จ
        window.addEventListener('DOMContentLoaded', fetchEquipments);
    </script>
</body>
</html>
